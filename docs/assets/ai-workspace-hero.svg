<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
  <title id="title">AI Workspace product overview</title>
  <desc id="description">A desktop workspace connecting multiple AI providers to Broadcast, Research Lab, and GEO workflows.</desc>

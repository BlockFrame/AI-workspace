name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const { version } = require("./package.json");
          const tag = process.env.RELEASE_TAG;
          const semverTag = /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          if (!semverTag.test(tag)) {
            throw new Error(`Release tag "${tag}" is not valid semantic versioning.`);
          }
          if (tag !== `v${version}`) {
            throw new Error(`Release tag "${tag}" must match package.json version "v${version}".`);
          }
          NODE

  build-release:
    name: Build Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            package-cmd: npm run package:win -- --publish never
            artifact-pattern: |
              release/*.exe
              release/*.exe.blockmap
              release/*.yml
          - platform: macOS
            os: macos-latest
            package-cmd: npm run package:mac -- --publish never
            artifact-pattern: |
              release/*.dmg
              release/*.zip
              release/*.zip.blockmap
              release/*.yml
          - platform: Linux
            os: ubuntu-latest
            package-cmd: npm run package:linux -- --publish never
            artifact-pattern: |
              release/*.AppImage
              release/*.deb
              release/*.tar.gz
              release/*.AppImage.blockmap
              release/*.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure optional Windows signing
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:SIGNING_CERTIFICATE) {
            "WIN_CSC_LINK=$env:SIGNING_CERTIFICATE" >> $env:GITHUB_ENV
            "WIN_CSC_KEY_PASSWORD=$env:SIGNING_PASSWORD" >> $env:GITHUB_ENV
          }

      - name: Configure optional macOS signing and notarization
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          SIGNING_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$SIGNING_CERTIFICATE" ]]; then
            {
              echo "CSC_LINK=$SIGNING_CERTIFICATE"
              echo "CSC_KEY_PASSWORD=$SIGNING_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
          if [[ -n "$NOTARIZATION_APPLE_ID" && -n "$NOTARIZATION_PASSWORD" && -n "$NOTARIZATION_TEAM_ID" ]]; then
            {
              echo "APPLE_ID=$NOTARIZATION_APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARIZATION_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARIZATION_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi

      - name: Build and package application
        run: ${{ matrix.package-cmd }}

      - name: Smoke test Windows application
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $executable = Get-Item "release\win-unpacked\AI Workspace.exe" -ErrorAction Stop
          $profile = Join-Path $env:RUNNER_TEMP "ai-workspace-smoke"
          $process = Start-Process `
            -FilePath $executable.FullName `
            -ArgumentList "--user-data-dir=$profile" `
            -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "The packaged Windows application exited during startup."
              }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0) {
              throw "The packaged Windows application started without showing a window."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
          }

      - name: Smoke test macOS application
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            executable="release/mac-arm64/AI Workspace.app/Contents/MacOS/AI Workspace"
          else
            executable="release/mac/AI Workspace.app/Contents/MacOS/AI Workspace"
          fi
          test -x "$executable"
          "$executable" --user-data-dir="$RUNNER_TEMP/ai-workspace-smoke" \
            >"$RUNNER_TEMP/ai-workspace-smoke.log" 2>&1 &
          app_pid=$!
          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid"
              wait "$app_pid" || true
            fi
          }
          trap cleanup EXIT
          sleep 15
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/ai-workspace-smoke.log"
            exit 1
          fi

      - name: Smoke test Linux AppImage
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          set +e
          timeout 15s env APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum "$appimage" \
            --no-sandbox \
            --user-data-dir="$RUNNER_TEMP/ai-workspace-smoke" \
            >"$RUNNER_TEMP/ai-workspace-smoke.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 124 ]]; then
            cat "$RUNNER_TEMP/ai-workspace-smoke.log"
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ github.ref_name }}
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

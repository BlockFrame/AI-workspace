name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            package-cmd: npm run package:win -- --publish never
            artifact-name: windows-build
            artifact-path: release/*.exe
          - platform: macOS
            os: macos-latest
            package-cmd: npm run package:mac -- --publish never
            artifact-name: macos-build
            artifact-path: |
              release/*.dmg
              release/*.zip
          - platform: Linux
            os: ubuntu-latest
            package-cmd: npm run package:linux -- --publish never
            artifact-name: linux-build
            artifact-path: |
              release/*.AppImage
              release/*.deb
              release/*.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package for ${{ matrix.platform }}
        run: ${{ matrix.package-cmd }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 30
